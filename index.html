<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Info Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    
    
    <header class="page-header">
      <h1>🍂 User Info Card</h1>
      <p>Enter your information below.</p>
    </header>

    
    
    <section class="card">
      <h2>User Information</h2>

      <form id="userForm">

        <div class="form-row">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Type your full name">
        </div>

        <div class="form-row">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Type your email address">
        </div>

        <div class="form-row">
          <label for="age">Age</label>
          <input type="number" id="age" min="1" max="120" placeholder="Type your age">
        </div>

        <div class="form-row">
          <label for="birthday">Birthday</label>
          <input type="date" id="birthday">
        </div>

        <div class="form-row">
          <label for="phone">Phone Number</label>
          <input type="text" id="phone" placeholder="Type your phone number">
        </div>

        <div class="form-row">
          <label for="address">Address</label>
          <input type="text" id="address" placeholder="Type your address">
        </div>

        <div class="form-row">
          <label for="favoriteColor">Favorite Color</label>
          <select id="favoriteColor">
            <option value="">-- Select a color --</option>
            <option value="Cream">Cream</option>
            <option value="Beige">Beige</option>
            <option value="Brown">Brown</option>
            <option value="Burnt Orange">Burnt Orange</option>
            <option value="Red">Red</option>
            <option value="Yellow">Yellow</option>
            <option value="Green">Green</option>
            <option value="Blue">Blue</option>
            <option value="Purple">Purple</option>
            <option value="Pink">Pink</option>
            <option value="Black">Black</option>
            <option value="White">White</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-row">
          <span class="field-label" id="genderLabel">Gender</span>
          <div class="radio-group" role="radiogroup" aria-labelledby="genderLabel">
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
          </div>
        </div>

        <div class="form-row">
          <label for="hobby">Hobby</label>
          <input type="text" id="hobby" placeholder="Type your hobby">
        </div>

        <div class="form-row">
          <label for="favoriteFood">Favorite Food</label>
          <input type="text" id="favoriteFood" placeholder="Type your favorite food">
        </div>

        <div class="form-row">
          <label for="occupation">Occupation</label>
          <input type="text" id="occupation" placeholder="Type your occupation">
        </div>

        <div class="form-row align-top">
          <label for="bio">Short Bio</label>
          <textarea id="bio" rows="4" placeholder="Write a short bio about yourself"></textarea>
        </div>

        <div class="button-row">
          <button type="submit" id="showInfoBtn" class="primary-button">Show My Info</button>
        </div>

      </form>
    </section>

    
    
    <section class="card">
      <h2>My Information</h2>

      <div id="output">
        <p class="empty-message">Your information will appear here.</p>
      </div>

      <p id="status" class="status-message"></p>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
